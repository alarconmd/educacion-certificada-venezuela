name: Validar entregables

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar generador PDF
        run: python -m pip install reportlab pypdf
      - name: Regenerar entregables
        run: |
          python build/build_pdf.py
          python build/build_data.py
      - name: Regresión hostil del estado
        run: node build/tools/test_state.js
      - name: Validar datos, informe, JavaScript y copias
        run: python build/validate.py
      - name: Comprobar diff
        run: git diff --check
